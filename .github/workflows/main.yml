name: Build Grapevine APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find and unpack Grapevine source
        shell: bash
        run: |
          set -euo pipefail

          echo "Files in repository:"
          find . -maxdepth 3 -type f | sort

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'Grapevine-Android-V12-VERIFICATION-BADGE-FIX.zip' -print -quit || true)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Grapevine ZIP file was found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf grapevine-source
          mkdir -p grapevine-source

          unzip -q "$ZIP_FILE" -d grapevine-source

          echo "Extracted files:"
          find grapevine-source -maxdepth 4 -type f | sort

          PROJECT_DIR="$(find grapevine-source -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find grapevine-source -type f -name gradlew -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android/Gradle project could not be found after extraction."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

            - name: Build Grapevine APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Android project:"
          pwd

          echo "Project files:"
          ls -la

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "No gradlew wrapper found."
            echo "Using installed Gradle 8.9."

            gradle clean assembleDebug --stacktrace
          fi

      - name: Locate and copy APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f -name '*.apk' -print -quit || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            echo "Searching entire workspace:"
            find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK found: $APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/Grapevine-V12.apk"

      - name: Upload Grapevine APK
        uses: actions/upload-artifact@v4
        with:
          name: Grapevine-V12-APK
          path: apk-output/Grapevine-V12.apk
          if-no-files-found: error
