name: Build Grapevine APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Grapevine
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack complete Android source
        run: |
          test -f grapevine-native-source.zip
          rm -rf .grapevine-build
          mkdir .grapevine-build
          unzip -q grapevine-native-source.zip -d .grapevine-build
          test -f .grapevine-build/settings.gradle
          test -f .grapevine-build/app/build.gradle
          test -f .grapevine-build/app/src/main/java/com/grapevine/app/MainActivity.java

      - name: Build Grapevine APK
        working-directory: .grapevine-build
        run: gradle --no-daemon assembleDebug

      - name: Upload Grapevine APK
        uses: actions/upload-artifact@v4
        with:
          name: Grapevine-debug-apk
          path: .grapevine-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
