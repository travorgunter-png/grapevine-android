name: Build Grapevine APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find and unpack Grapevine source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Grapevine-Android-FINAL.zip"
          test -f "$ZIP_FILE"
          rm -rf .grapevine-build
          mkdir -p .grapevine-build
          unzip -q "$ZIP_FILE" -d .grapevine-build

          test -f .grapevine-build/settings.gradle
          test -f .grapevine-build/build.gradle
          test -f .grapevine-build/app/build.gradle
          test -f .grapevine-build/app/src/main/AndroidManifest.xml
          test -f .grapevine-build/app/src/main/java/com/grapevine/app/MainActivity.java

      - name: Build Grapevine APK
        working-directory: .grapevine-build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and copy APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$GITHUB_WORKSPACE/.grapevine-build" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/Grapevine.apk"
          test -s "$GITHUB_WORKSPACE/Grapevine.apk"
          ls -lh "$GITHUB_WORKSPACE/Grapevine.apk"

      - name: Upload Grapevine APK
        uses: actions/upload-artifact@v4
        with:
          name: Grapevine-APK
          path: Grapevine.apk
          if-no-files-found: error
          retention-days: 30
