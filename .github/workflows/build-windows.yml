
name: Build Grapevine Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Windows project files
        shell: pwsh
        run: |
          if (!(Test-Path "windows/package.json")) {
            throw "Missing windows/package.json. The Windows desktop project must be added first."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        working-directory: windows
        run: npm ci

      - name: Build Windows installer
        working-directory: windows
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GRAPEVINE-Windows-V26
          path: |
            windows/dist/*.exe
            windows/dist/*.msi
          if-no-files-found: error
          retention-days: 14
