
name: Build GRAPEVINE Windows App

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-app/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer and portable EXE
        run: npm run dist:win

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: GRAPEVINE-Windows-V26
          path: windows-app/dist/*.exe
          if-no-files-found: error
          retention-days: 30
