
name: Build Grapevine Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Firebase configuration
        run: |
          test -f app/google-services.json || {
            echo "ERROR: app/google-services.json is missing"
            exit 1
          }

      - name: Build Android release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAPEVINE-Android-V28
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
