name: Build Grapevine V28

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Grapevine V28
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Grapevine V28 source
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -s app/google-services.json
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/grapevine/app/MainActivity.java
          test -f app/src/main/assets/app.js
          test -f app/src/main/assets/SUPABASE_SETUP.sql
          test -f supabase/functions/mafia-ai-chat/index.ts
          test -f supabase/functions/send-push-notification/index.ts
          test -f supabase/FCM_DEVICE_TOKENS.sql
          grep -q "com.google.firebase:firebase-messaging" app/build.gradle
          grep -q "GrapevineFirebaseMessagingService" app/src/main/AndroidManifest.xml
          grep -q "member_notifications" app/src/main/assets/SUPABASE_SETUP.sql
          grep -q "Owners can delete their own Mafia AI conversations" app/src/main/assets/SUPABASE_SETUP.sql
          grep -q "minSdk 26" app/build.gradle
          grep -q "versionCode 28" app/build.gradle
          grep -q "is_grapevine_admin" app/src/main/assets/app.js
          grep -q "redirect_to=" app/src/main/assets/app.js
          grep -q "Messages & Replies" app/src/main/assets/app.js
          grep -q "gallery-media" app/src/main/assets/app.js
          grep -q "grapevine.*auth-callback" app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/grapevine_badge_launcher.png

      - name: Check JavaScript syntax
        run: node --check app/src/main/assets/app.js

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" Grapevine-V28.apk
          ls -lh Grapevine-V28.apk

      - name: Upload Grapevine V28 APK
        uses: actions/upload-artifact@v4
        with:
          name: Grapevine-V28-APK
          path: Grapevine-V28.apk
          if-no-files-found: error
          retention-days: 30
